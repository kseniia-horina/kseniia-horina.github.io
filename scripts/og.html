<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/css/fonts.css">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;background:#0F1014;color:#ECECF1;font-family:"Source Serif 4",Georgia,serif;overflow:hidden;position:relative}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45}
  .b1{width:520px;height:520px;left:-160px;top:-180px;background:#2FBFA6}
  .b2{width:460px;height:460px;left:520px;top:-260px;background:#A27FF0}
  .b3{width:520px;height:520px;right:-200px;bottom:-260px;background:#F06A97}
  .grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff10 1px,transparent 1px),linear-gradient(90deg,#ffffff10 1px,transparent 1px);background-size:60px 60px}
  .wrap{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:14px;font-family:"IBM Plex Mono",monospace;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:#A3A7B4}
  .mark{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:"Space Grotesk";font-weight:700;font-size:17px;letter-spacing:0;
    background:conic-gradient(from 200deg,#0E7C6B,#6B3FC4,#C42F63,#0E7C6B)}
  h1{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:118px;line-height:.92;letter-spacing:-.055em;margin-top:36px}
  h1 span{background:linear-gradient(100deg,#3DDCBF,#B79BFF 55%,#FF8DB4);-webkit-background-clip:text;color:transparent}
  .pitch{font-size:29px;line-height:1.35;margin-top:28px;max-width:44ch;color:#D6D7DE}
  .stats{margin-top:auto;display:flex;gap:16px}
  .s{font-family:"IBM Plex Mono",monospace;font-size:19px;padding:12px 20px;border-radius:999px;border:1px solid #ffffff26;background:#ffffff0d;display:flex;gap:10px;align-items:center}
  .s b{font-family:"Space Grotesk";font-size:24px;color:#fff}
  .ok{color:#3DDC97}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grid"></div>
<div class="wrap">
  <div class="top"><span class="mark">KH</span><span id="role"></span></div>
  <h1>Kseniia<br><span>Horina</span></h1>
  <p class="pitch" id="pitch"></p>
  <div class="stats" id="stats"></div>
</div>
<script>
  var L = {
    en: { role: 'QA Engineer · Wrocław', pitch: 'Three years across six industries — most of it owning testing end to end.',
          stats: [['12','products'],['6','industries'],['9','as sole QA']] },
    pl: { role: 'QA Engineer · Wrocław', pitch: 'Trzy lata w sześciu branżach — najczęściej z pełną odpowiedzialnością za testy.',
          stats: [['12','produktów'],['6','branż'],['9','jako jedyna w QA']] }
  }[new URLSearchParams(location.search).get('lang') || 'en'];
  document.getElementById('role').textContent = L.role;
  document.getElementById('pitch').textContent = L.pitch;
  document.getElementById('stats').innerHTML = L.stats.map(function (s) {
    return '<span class="s"><span class="ok">✓</span><b>' + s[0] + '</b>' + s[1] + '</span>';
  }).join('');
</script>
</body>
</html>
