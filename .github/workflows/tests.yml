name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright + axe
    runs-on: ubuntu-24.04
    # Official Playwright image: Chromium and its system libraries are preinstalled,
    # so there is no browser install step to fail. Keep the tag equal to the
    # exact @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
